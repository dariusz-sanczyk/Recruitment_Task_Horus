<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2 mb-0 fw-bold text-dark">
      <i class="bi bi-list-check me-2"></i>Lista zadań
    </h1>
    <button class="btn btn-primary btn-lg shadow-sm" (click)="openModal()">
      Dodaj zadanie
    </button>
  </div>

  <app-task-filter
    [filterName]="filterName"
    [filterDate]="filterDate"
    [filterStatus]="filterStatus"
    [hasActiveFilters]="hasActiveFilters()"
    (filterNameChange)="onFilterNameChange($event)"
    (filterDateChange)="onFilterDateChange($event)"
    (filterStatusChange)="onFilterStatusChange($event)"
    (clearFilters)="clearFilters()">
  </app-task-filter>

  <app-task-list
    [tasks]="getFilteredTasks()"
    [totalTasks]="tasks.length"
    (toggleCompleted)="toggleCompleted($event)"
    (togglePending)="togglePending($event)"
    (toggleDescription)="toggleDescription($event)"
    (deleteTask)="deleteTask($event)"
    (clearFilters)="clearFilters()">
  </app-task-list>

  <app-add-task-modal
    [show]="showModal"
    [newTask]="newTask"
    [formSubmitted]="formSubmitted"
    (close)="closeModal()"
    (save)="saveTask($event)">
  </app-add-task-modal>

  <app-delete-task-modal
    [show]="showDeleteModal"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()">
  </app-delete-task-modal>
</div>
